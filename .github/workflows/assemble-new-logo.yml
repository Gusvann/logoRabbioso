name: Assemble new QR logo

on:
  push:
    paths:
      - '.github/workflows/assemble-new-logo.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild uploaded PNG and publish at repository root
        shell: bash
        run: |
          set -euo pipefail
          cat .qr-upload/part0.txt .qr-upload/part1.txt .qr-upload/part2.txt .qr-upload/part3.txt .qr-upload/part4.txt .qr-upload/part5.txt .qr-upload/part6.txt .qr-upload/part7.txt .qr-upload/part8.txt > /tmp/logo.b64
          base64 -d /tmp/logo.b64 > /tmp/source.png

          echo 'f42e4b53c344f85d2b07fff9ba6d2404a3d40d005954b23432d38d3b820f8d34  /tmp/source.png' | sha256sum -c -

          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib

          src = Path('/tmp/source.png')
          out = Path('qr-logo.png')
          with Image.open(src) as im:
              im.load()
              assert im.size == (512, 512), im.size
              rgba = im.convert('RGBA')
              rgba.save(out, format='PNG', optimize=True, compress_level=9)

          with Image.open(out) as check:
              check.load()
              assert check.size == (512, 512), check.size
              assert check.mode == 'RGBA', check.mode
              alpha = check.getchannel('A').getextrema()
              assert alpha[0] == 0 and alpha[1] == 255, alpha

          print('FINAL_OK', out.stat().st_size, hashlib.sha256(out.read_bytes()).hexdigest())
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qr-logo.png
          git commit -m 'Add new QR logo at repository root'
          git push
