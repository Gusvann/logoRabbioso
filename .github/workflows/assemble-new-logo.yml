name: Verify final QR logo

on:
  push:
    paths:
      - '.github/workflows/assemble-new-logo.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify raw root image and QuickChart
        shell: bash
        run: |
          set -euo pipefail
          RAW_URL='https://raw.githubusercontent.com/Gusvann/logoRabbioso/main/qr-logo.png'

          code=$(curl -L --silent --show-error --max-time 20 "$RAW_URL" -o /tmp/logo.png -w '%{http_code}')
          test "$code" = '200'
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('/tmp/logo.png')
          print('RAW_BYTES', p.stat().st_size)
          with Image.open(p) as im:
              im.load()
              print('RAW_IMAGE', im.size, im.mode)
              assert im.size == (512, 512)
          PY

          code=$(curl -L --silent --show-error --max-time 30 \
            --get 'https://quickchart.io/qr' \
            --data-urlencode 'text=JR-TEST' \
            --data-urlencode 'caption=Prueba' \
            --data-urlencode 'captionFontSize=20' \
            --data-urlencode 'light=fff5ee' \
            --data-urlencode 'dark=c62828' \
            --data-urlencode 'size=500' \
            --data-urlencode 'centerImageSizeRatio=0.25' \
            --data-urlencode "centerImageUrl=$RAW_URL" \
            -o /tmp/qr.png -w '%{http_code}')
          echo "QUICKCHART_HTTP=$code"
          test "$code" = '200'
          python - <<'PY'
          from PIL import Image
          with Image.open('/tmp/qr.png') as im:
              im.load()
              print('QUICKCHART_IMAGE', im.size, im.mode)
              assert im.size == (500, 500)
          PY
