name: Convert QR logo to RGBA PNG

on:
  push:
    paths:
      - '.github/workflows/convert-qr-logo-rgba.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Convert palette PNG to truecolor RGBA
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import struct

          target = Path('public/assets/jiving-rabbits/qr-logo.png')
          tmp = Path('/tmp/qr-logo-rgba.png')
          with Image.open(target) as im:
              im = im.convert('RGBA')
              im.save(tmp, format='PNG', optimize=True, compress_level=9)

          data = tmp.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          w, h = struct.unpack('>II', data[16:24])
          assert (w, h) == (512, 512)
          print('RGBA_PNG_OK', len(data), w, h)
          tmp.replace(target)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/jiving-rabbits/qr-logo.png
          git commit -m 'Convert QR logo to RGBA PNG for QuickChart compatibility'
          git push
