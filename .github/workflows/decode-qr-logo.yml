name: Decode QR logo

on:
  push:
    paths:
      - '.github/workflows/decode-qr-logo.yml'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Decode PNG payload
        shell: bash
        run: |
          set -euo pipefail
          target='public/assets/jiving-rabbits/qr-logo.png'
          tmp="${target}.decoded"
          base64 -d "$target" > "$tmp"
          python - <<'PY'
          from pathlib import Path
          p = Path('public/assets/jiving-rabbits/qr-logo.png.decoded')
          data = p.read_bytes()
          assert data.startswith(b'\x89PNG\r\n\x1a\n'), 'Decoded payload is not a PNG'
          print('PNG bytes:', len(data))
          PY
          mv "$tmp" "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'Decode optimized QR logo PNG'
          git push
