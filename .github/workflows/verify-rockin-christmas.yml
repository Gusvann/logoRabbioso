name: Diagnose Rockin Christmas QR

on:
  push:
    paths:
      - '.github/workflows/verify-rockin-christmas.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose QuickChart
        shell: bash
        run: |
          set -euo pipefail
          RAW_URL='https://raw.githubusercontent.com/Gusvann/logoRabbioso/main/rockin-christmas.png'

          echo '--- RAW ---'
          code=$(curl -L --silent --show-error --max-time 20 "$RAW_URL" -o /tmp/logo.png -w '%{http_code}')
          echo "RAW_HTTP=$code"
          file /tmp/logo.png || true
          wc -c /tmp/logo.png || true

          echo '--- VALIDATE CENTER IMAGE ---'
          curl -sS --max-time 30 'https://quickchart.io/api/validate-qr'             -H 'Content-Type: application/json'             --data-binary '{"text":"JR-TEST","centerImageUrl":"https://raw.githubusercontent.com/Gusvann/logoRabbioso/main/rockin-christmas.png"}' || true
          echo

          echo '--- VALIDATE FULL ---'
          curl -sS --max-time 30 'https://quickchart.io/api/validate-qr'             -H 'Content-Type: application/json'             --data-binary '{"text":"JR-TEST","caption":"Prueba","captionFontSize":20,"light":"fff5ee","dark":"c62828","size":500,"centerImageSizeRatio":0.25,"centerImageUrl":"https://raw.githubusercontent.com/Gusvann/logoRabbioso/main/rockin-christmas.png"}' || true
          echo

          echo '--- GET CENTER IMAGE ONLY ---'
          code=$(curl -L --silent --show-error --max-time 30             --get 'https://quickchart.io/qr'             --data-urlencode 'text=JR-TEST'             --data-urlencode "centerImageUrl=$RAW_URL"             -o /tmp/only.out -w '%{http_code}')
          echo "ONLY_HTTP=$code"
          file /tmp/only.out || true

          echo '--- GET WIDTH HEIGHT ---'
          code=$(curl -L --silent --show-error --max-time 30             --get 'https://quickchart.io/qr'             --data-urlencode 'text=JR-TEST'             --data-urlencode 'size=500'             --data-urlencode 'centerImageWidth=120'             --data-urlencode 'centerImageHeight=90'             --data-urlencode "centerImageUrl=$RAW_URL"             -o /tmp/wh.out -w '%{http_code}')
          echo "WH_HTTP=$code"
          file /tmp/wh.out || true
