name: Diagnose QR logo chunks

on:
  push:
    paths:
      - '.github/workflows/assemble-new-logo.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check staged chunks
        shell: bash
        run: |
          set -euo pipefail
          wc -c .qr-upload/part*.txt
          sha256sum .qr-upload/part*.txt
